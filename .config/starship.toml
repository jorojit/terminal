# Inserts a blank line between shell prompts
add_newline = true

# Change the default prompt format
format = """\
[╭╴](238)$env_var\
$all[╰─](238)$character"""

# Change the default prompt characters
[character]
success_symbol = "[󰄬](green)"
error_symbol = "[󰅖](red)"

# Shows an icon depending on what distro it is running on
[env_var.STARSHIP_DISTRO]
format = '[$env_value](bold white) '
variable = "STARSHIP_DISTRO"
disabled = false


# Shows an icon depending on what device it is running on
[env_var.STARSHIP_DEVICE]
format = '[$env_value](bold yellow)'
variable = "STARSHIP_DEVICE"
disabled = false

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
style = 'bold blue'
symbol = '🅰 '
[aws.region_aliases]
ap-southeast-2 = 'au'
us-east-1 = 'va'
[aws.profile_aliases]
CompanyGroupFrobozzOnCallAccess = 'Frobozz'

[azure]
disabled = false
format = 'on [$symbol($subscription)]($style) '
symbol = '󰠅 '
style = 'blue bold'

# Shows current directory
[directory]
truncation_length = 20
truncation_symbol = "…/"
home_symbol = "󱂵 ~"
read_only_style = "197"
read_only = "󰌾"
format = "[$path]($style)[$read_only]($read_only_style) "

# Shows current git branch
[git_branch]
symbol = "󰊢 "
format = "[$symbol$branch]($style) "
# truncation_length = 5
truncation_symbol = "…/"
style = "bold green"

# Shows current git status
[git_status]
format = '[\($all_status$ahead_behind\)]($style) '
style = "bold green"
conflicted = "󰞇"
up_to_date = "󰄬"
untracked = "!"
ahead = "󰶣${count}"
diverged = "󰹹󰶣${ahead_count}󰶡${behind_count}"
behind = "󰶡${count}"
stashed = "󱗜"
modified = "󰷉"
staged = '[++\($count\)](green)'
renamed = "󰚔"
deleted = "󰆴"

[kubernetes]
[kubernetes]
format = '[󱃾 $context](bold red)[\($namespace\)](bold yellow) '
disabled = false
detect_files = ['k8s', 'helm', 'kustomization.yaml', 'helmfile.yaml']
detect_extensions = ['yaml', 'yml']
detect_folders = ['.kube', 'k8s', 'kubernetes', 'helm', 'charts', 'manifests', 'deploy']

# Modules status
[username]
disabled = true

[vagrant]
disabled = true

[docker_context]
disabled = true

[helm]
disabled = false

[python]
disabled = true

[terraform]
disabled = false
